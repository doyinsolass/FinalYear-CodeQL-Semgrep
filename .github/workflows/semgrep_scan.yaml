name: Semgrep OWASP Scan 

on:
  workflow_dispatch:
    inputs:
      rule_count:
        description: "Number of OWASP rules to include"
        required: true
        default: "5"

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install semgrep pyyaml jq

      - name: Generate Semgrep YAML
        run: |
          export RULE_COUNT=${{ github.event.inputs.rule_count }}
          python generate_yaml.py

      - name: Run Semgrep and save results
        run: semgrep --config semgrep_scan.yaml --sarif > semgrep_results.sarif
        continue-on-error: true

      - name: Count vulnerabilities
        run: |
          count=$(jq '.runs[0].results | length' semgrep_results.sarif)
          echo "findings=$count" >> $GITHUB_ENV

      - name: Upload Semgrep results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep_results.sarif

      - name: Show Semgrep summary
        if: always()
        run: |
          echo "### Semgrep Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Vulnerabilities Found:** ${{ env.findings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.findings }}" -gt 0 ]; then
            echo "Some vulnerabilities were detected. Review semgrep_results.sarif for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
          fi

  defectdojo-upload:
    runs-on: self-hosted
    needs: semgrep

    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-findings

      - name: Verify SARIF exists
        run: ls -R .

      - name: Install jq (fast)
        run: |
          curl -L -o jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
          chmod +x jq
          sudo mv jq /usr/local/bin

      - name: Debug secret names
        run: |
          echo "Secrets available:"
          echo "${{ toJson(secrets) }}"

      - name: Upload SARIF to DefectDojo (manual)
        env:
          DEFECT_DOJO_URL: ${{ secrets.DEFECT_DOJO_URL }}
          DEFECT_DOJO_USERNAME: ${{ secrets.DEFECT_DOJO_USERNAME }}
          DEFECT_DOJO_PASSWORD: ${{ secrets.DEFECT_DOJO_PASSWORD }}
        run: |
          echo "Authenticating with DefectDojo..."
      
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"username": "'"${DEFECT_DOJO_USERNAME}"'", "password": "'"${DEFECT_DOJO_PASSWORD}"'"}' \
            "${DEFECT_DOJO_URL}/api/v2/api-token-auth/" | jq -r .token)
      
          echo "Token received: ${#TOKEN} characters"
      
          echo "Uploading SARIF..."
          curl -s -X POST \
            -H "Authorization: Token $TOKEN" \
            -F "file=@semgrep-findings/semgrep_results.sarif" \
            -F "scan_type=SARIF" \
            -F "product_name=FinalYear-CodeQL-Semgrep" \
            -F "engagement_name=import" \
            "${DEFECT_DOJO_URL}/api/v2/import-scan/"


