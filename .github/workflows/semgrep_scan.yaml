name: Semgrep OWASP Scan

on:
  workflow_dispatch:
    inputs:
      rule_count:
        description: "Number of OWASP rules to include"
        required: true
        default: "5"

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install semgrep pyyaml jq

      - name: Generate Semgrep YAML
        run: |
          export RULE_COUNT=${{ github.event.inputs.rule_count }}
          python generate_yaml.py

      - name: Run Semgrep and save results
        run: semgrep --config semgrep_scan.yaml --sarif > semgrep_results.sarif
        continue-on-error: true

      - name: Count vulnerabilities
        run: |
          count=$(jq '.runs[0].results | length' semgrep_results.sarif)
          echo "findings=$count" >> $GITHUB_ENV

      - name: Upload Semgrep results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep_results.sarif

      - name: Show Semgrep summary
        if: always()
        run: |
          echo "### Semgrep Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Vulnerabilities Found:** ${{ env.findings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.findings }}" -gt 0 ]; then
            echo "Some vulnerabilities were detected. Review semgrep_results.sarif for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No vulnerabilities detected." >> $GITHUB_STEP_SUMMARY
          fi

  defectdojo-upload:
    runs-on: self-hosted
    needs: semgrep

    steps:
      - name: Download SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-findings

      - name: Verify SARIF exists
        run: ls -R .

      - name: Rename SARIF file
        run: mv semgrep_results.sarif semgrep_results.sarif

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Upload SARIF to DefectDojo
        uses: C4tWithShell/defectdojo-action@1.0.5
        with:
          token: ${{ secrets.DEFECTOJO_TOKEN }}
          defectdojo_url: ${{ secrets.DEFECTOJO_URL }}

          product_type: "Research and Development"
          product: "FinalYear-CodeQL-Semgrep"
          engagement: "main"

          test_type: "Semgrep Scan"
          environment: "GitHub Actions"
          tools: "Semgrep"
          file_type: "sarif"

          reports: "semgrep_results.sarif"
