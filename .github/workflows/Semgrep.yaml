name: Semgrep Security Scan  

on:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Run Semgrep Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep with built-in security rules
        run: semgrep --config=p/semgrep-security-audit --sarif --output=semgrep-results.sarif
        continue-on-error: true

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Display Semgrep scan summary
        if: always()
        run: |
          echo "### 🧾 Semgrep Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          findings_count=$(jq '.runs[0].results | length' semgrep-results.sarif)
          echo "**Total Vulnerabilities Found:** $findings_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$findings_count" -gt 0 ]; then
            echo "⚠️ Vulnerabilities were detected. Please review the SARIF report in the Security tab." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities detected!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SARIF file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
