name: Generated Rules Scan  

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rule_count:
        description: "Number of Generated Rules to run (Max 20)"
        required: true
        default: "20"

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep and tools
        run: pip install semgrep jq

      - name: Write custom JavaScript security rules
        run: |
          mkdir -p .semgrep
          echo "rules:" > .semgrep/security-rules.yml
          echo "  - id: detect-hardcoded-aws-secret-js" >> .semgrep/security-rules.yml
          echo "    pattern: const aws_secret_access_key = \"\$SECRET\"" >> .semgrep/security-rules.yml
          echo "    message: \"Hardcoded AWS secret detected.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-console-log-debug" >> .semgrep/security-rules.yml
          echo "    pattern: console.log(\$X)" >> .semgrep/security-rules.yml
          echo "    message: \"Debug console.log statement found; remove before production.\"" >> .semgrep/security-rules.yml
          echo "    severity: WARNING" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-eval-usage-js" >> .semgrep/security-rules.yml
          echo "    pattern: eval(\$EXPR)" >> .semgrep/security-rules.yml
          echo "    message: \"Use of eval() can lead to code injection vulnerabilities.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-function-constructor" >> .semgrep/security-rules.yml
          echo "    pattern: new Function(\$ARGS)" >> .semgrep/security-rules.yml
          echo "    message: \"Use of Function constructor can lead to security issues.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-settimeout-string" >> .semgrep/security-rules.yml
          echo "    pattern-either:" >> .semgrep/security-rules.yml
          echo "      - pattern: setTimeout(\"\$CODE\", ...)" >> .semgrep/security-rules.yml
          echo "      - pattern: setInterval(\"\$CODE\", ...)" >> .semgrep/security-rules.yml
          echo "    message: \"Avoid using string arguments in setTimeout/setInterval; potential code injection.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-document-write-js" >> .semgrep/security-rules.yml
          echo "    pattern: document.write(\$X)" >> .semgrep/security-rules.yml
          echo "    message: \"document.write() can lead to XSS vulnerabilities.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-innerhtml-assignment" >> .semgrep/security-rules.yml
          echo "    pattern: \$OBJ.innerHTML = \$VAL" >> .semgrep/security-rules.yml
          echo "    message: \"Assignment to innerHTML can lead to XSS vulnerabilities.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-localstorage-usage" >> .semgrep/security-rules.yml
          echo "    pattern: localStorage.setItem(\$KEY, \$VAL)" >> .semgrep/security-rules.yml
          echo "    message: \"Avoid storing sensitive data in localStorage.\"" >> .semgrep/security-rules.yml
          echo "    severity: WARNING" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-unsafe-regex" >> .semgrep/security-rules.yml
          echo "    pattern: new RegExp(\$PATTERN)" >> .semgrep/security-rules.yml
          echo "    message: \"Potentially unsafe regular expression. Validate input or use static patterns.\"" >> .semgrep/security-rules.yml
          echo "    severity: WARNING" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml
          echo "" >> .semgrep/security-rules.yml
          echo "  - id: detect-insecure-http" >> .semgrep/security-rules.yml
          echo "    pattern: fetch(\"http://\$URL\", ...)" >> .semgrep/security-rules.yml
          echo "    message: \"Use HTTPS instead of HTTP for secure data transmission.\"" >> .semgrep/security-rules.yml
          echo "    severity: ERROR" >> .semgrep/security-rules.yml
          echo "    languages: [javascript]" >> .semgrep/security-rules.yml

      - name: Run Semgrep with custom rules and generate SARIF report
        run: semgrep --config=.semgrep/security-rules.yml --sarif --output=semgrep_results.sarif
        continue-on-error: true

      - name: Count Semgrep vulnerabilities
        run: |
          if [ ! -f semgrep_results.sarif ]; then
            echo "No semgrep_results.sarif file. Setting findings to 0."
            echo "semgrep_findings=0" >> $GITHUB_ENV
            exit 0
          fi
          count=$(jq '.runs[0].results | length' semgrep_results.sarif 2>/dev/null || echo 0)
          echo "Semgrep findings: $count"
          echo "semgrep_findings=$count" >> $GITHUB_ENV

      - name: Upload Semgrep SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep_results.sarif

      - name: Display Semgrep scan summary
        if: always()
        run: |
          echo "### 🧾 Semgrep Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          findings_count=${{ env.semgrep_findings }}
          echo "**Total Vulnerabilities Found:** $findings_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$findings_count" -gt 0 ]; then
            echo "⚠️ Vulnerabilities were detected. Please review the Semgrep SARIF report." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No vulnerabilities detected by Semgrep." >> $GITHUB_STEP_SUMMARY
          fi

  codeql:
    runs-on: ubuntu-latest
    needs: semgrep
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: ./codeql-queries.ql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results.sarif

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: codeql-results.sarif

  merge-sarif:
    runs-on: ubuntu-latest
    needs: [semgrep, codeql]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Semgrep SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-findings

      - name: Download CodeQL SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-findings
        continue-on-error: true

      - name: Verify downloaded files
        run: |
          echo "Listing files after artifact download:"
          ls -R .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install merge dependencies
        run: pip install jq

      - name: Merge Semgrep and CodeQL SARIF
        run: |
          echo "Merging semgrep_results.sarif and codeql-results.sarif into merged.sarif"
          python merge_sarif.py

      - name: Upload merged SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-sarif
          path: merged.sarif

  defectdojo-upload:
    runs-on: self-hosted
    needs: merge-sarif

    steps:
      - name: Download merged SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-sarif

      - name: Verify merged SARIF exists
        run: |
          echo "Listing files before upload:"
          ls -R .

      - name: Install jq (fast)
        run: |
          curl -L -o jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
          chmod +x jq
          sudo mv jq /usr/local/bin

      - name: Upload merged SARIF to DefectDojo
        env:
          DEFECT_DOJO_URL: ${{ secrets.DEFECT_DOJO_URL }}
          DEFECT_DOJO_USERNAME: ${{ secrets.DEFECT_DOJO_USERNAME }}
          DEFECT_DOJO_PASSWORD: ${{ secrets.DEFECT_DOJO_PASSWORD }}
        run: |
          echo "Authenticating with DefectDojo..."
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"username": "'"${DEFECT_DOJO_USERNAME}"'", "password": "'"${DEFECT_DOJO_PASSWORD}"'"}' \
            "${DEFECT_DOJO_URL}/api/v2/api-token-auth/" | jq -r .token)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain DefectDojo token"
            exit 1
          fi
          echo "Token received: ${#TOKEN} characters"
          echo "Uploading merged.sarif to DefectDojo..."
          curl -s -X POST \
            -H "Authorization: Token $TOKEN" \
            -F "file=@merged.sarif" \
            -F "scan_type=SARIF" \
            -F "product_name=FinalYear-CodeQL-Semgrep" \
            -F "engagement_name=import" \
            "${DEFECT_DOJO_URL}/api/v2/import-scan/"
