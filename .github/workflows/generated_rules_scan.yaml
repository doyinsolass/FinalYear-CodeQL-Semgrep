name: Generated Rules Scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rule_count:
        description: "Number of Generated Rules to run (Max 20)"
        required: true
        default: "20"

jobs:
  semgrep:
    runs-on: ubuntu-latest
    env:
      RULE_COUNT: ${{ github.event.inputs.rule_count || '20' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install semgrep pyyaml jq

      - name: Generate Semgrep YAML
        run: |
          echo "Generating Semgrep rules for RULE_COUNT=$RULE_COUNT"
          python generate_yaml.py

      - name: Run Semgrep and save results
        run: |
          semgrep --config semgrep_scan.yaml --sarif > semgrep_results.sarif 2> semgrep_errors.log || true

      - name: Show Semgrep errors
        if: always()
        run: |
          echo "=== semgrep_errors.log ==="
          if [ -f semgrep_errors.log ]; then
            cat semgrep_errors.log
          else
            echo "No semgrep_errors.log"
          fi

      - name: Count Semgrep vulnerabilities
        run: |
          if [ ! -f semgrep_results.sarif ]; then
            echo "No semgrep_results.sarif file. Setting findings to 0."
            echo "semgrep_findings=0" >> $GITHUB_ENV
            exit 0
          fi
          count=$(jq '.runs[0].results | length' semgrep_results.sarif 2>/dev/null || echo 0)
          echo "Semgrep findings: $count"
          echo "semgrep_findings=$count" >> $GITHUB_ENV

      - name: Upload Semgrep results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep_results.sarif

      - name: Show Semgrep summary
        if: always()
        run: |
          echo "### Semgrep Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total Vulnerabilities Found (Semgrep):** ${{ env.semgrep_findings }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.semgrep_findings }}" -gt 0 ]; then
            echo "Some vulnerabilities were detected by Semgrep. Review semgrep_results.sarif for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "No vulnerabilities detected by Semgrep." >> $GITHUB_STEP_SUMMARY
          fi

  codeql:
    runs-on: ubuntu-latest
    needs: semgrep
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: ./codeql-queries.ql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results.sarif

      - name: Upload CodeQL results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-findings
          path: codeql-results.sarif

  merge-sarif:
    runs-on: ubuntu-latest
    needs: [semgrep, codeql]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download Semgrep SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: semgrep-findings

      - name: Download CodeQL SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: codeql-findings
        continue-on-error: true

      - name: Verify downloaded files
        run: |
          echo "Listing files after artifact download:"
          ls -R .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install merge dependencies
        run: pip install jq

      - name: Merge Semgrep and CodeQL SARIF
        run: |
          echo "Merging semgrep_results.sarif and codeql-results.sarif into merged.sarif"
          python merge_sarif.py

      - name: Upload merged SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-sarif
          path: merged.sarif

  defectdojo-upload:
    runs-on: self-hosted
    needs: merge-sarif

    steps:
      - name: Download merged SARIF artifact
        uses: actions/download-artifact@v4
        with:
          name: merged-sarif

      - name: Verify merged SARIF exists
        run: |
          echo "Listing files before upload:"
          ls -R .

      - name: Install jq (fast)
        run: |
          curl -L -o jq https://github.com/stedolan/jq/releases/download/jq-1.6/jq-linux64
          chmod +x jq
          sudo mv jq /usr/local/bin

      - name: Upload merged SARIF to DefectDojo
        env:
          DEFECT_DOJO_URL: ${{ secrets.DEFECT_DOJO_URL }}
          DEFECT_DOJO_USERNAME: ${{ secrets.DEFECT_DOJO_USERNAME }}
          DEFECT_DOJO_PASSWORD: ${{ secrets.DEFECT_DOJO_PASSWORD }}
        run: |
          echo "Authenticating with DefectDojo..."

          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"username": "'"${DEFECT_DOJO_USERNAME}"'", "password": "'"${DEFECT_DOJO_PASSWORD}"'"}' \
            "${DEFECT_DOJO_URL}/api/v2/api-token-auth/" | jq -r .token)

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain DefectDojo token"
            exit 1
          fi

          echo "Token received: ${#TOKEN} characters"

          echo "Uploading merged.sarif to DefectDojo..."
          curl -s -X POST \
            -H "Authorization: Token $TOKEN" \
            -F "file=@merged.sarif" \
            -F "scan_type=SARIF" \
            -F "product_name=FinalYear-CodeQL-Semgrep" \
            -F "engagement_name=Generated Rules Scan" \
            "${DEFECT_DOJO_URL}/api/v2/import-scan/"

          echo "Upload completed."
